name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: website
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.OCR_REPOSITORY || 'EoD/d4-item-tooltip-ocr' }}
          ref: ${{ vars.OCR_REF || 'main' }}
          path: ocr
      - name: Build the static site
        run: docker build --build-arg VENDOR=cdn --build-arg SOURCE_URL=${{ github.server_url }}/${{ github.repository }} --build-context ocr=ocr --target pages --output site website
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
