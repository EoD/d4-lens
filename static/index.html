<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>D4 Lens</title>
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="style.css">
	<script type="module" src="app.js"></script>
</head>
<body>
	<header class="page-header">
		<h1>D4 Lens</h1>
		<p class="subtitle">Diablo IV item tooltips to JSON</p>
	</header>

	<main>
		<label class="dropzone" id="dropzone">
			<input type="file" id="file-input" multiple accept="image/png,image/jpeg,image/webp">
			<span class="dropzone-title">Drop, paste or click to add screenshots</span>
		</label>

		<div class="toolbar" id="toolbar" hidden>
			<p class="summary" id="summary" aria-live="polite"></p>
			<div class="toolbar-actions">
				<button type="button" id="download-all" class="primary">Download all</button>
				<button type="button" id="copy-all">Copy all</button>
				<button type="button" id="clear-all">Clear all</button>
			</div>
		</div>

		<p class="notice" id="notice" role="status" aria-live="polite" hidden></p>

		<ol class="cards" id="cards"></ol>
	</main>

	<footer class="page-footer">
		<p>Not affiliated with Blizzard Entertainment. Diablo is a trademark of Blizzard Entertainment, Inc.</p>
	</footer>

	<div class="drop-overlay" aria-hidden="true">Drop to add screenshots</div>

	<template id="card-template">
		<li class="card" data-status="queued">
			<a class="thumb" target="_blank" rel="noopener" title="Open the full screenshot">
				<img alt="" loading="lazy">
			</a>
			<div class="card-body">
				<div class="card-header">
					<h2 class="card-name"></h2>
					<span class="status"></span>
					<span class="card-actions">
						<button type="button" class="copy" disabled>Copy JSON</button>
						<button type="button" class="remove" title="Remove" aria-label="Remove">✕</button>
					</span>
				</div>
				<pre class="json" hidden></pre>
				<div class="error" hidden>
					<p class="error-message"></p>
					<ul class="error-details"></ul>
				</div>
			</div>
		</li>
	</template>
</body>
</html>
